services:
  postgres:
    image: postgres:17-alpine
    container_name: digiverse_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-digiverse_staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-digiverse_staging}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER:-digiverse_staging} -d ${STAGING_POSTGRES_DB:-digiverse_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: digiverse_staging_s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-digiverse_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - staging_s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.staging
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    container_name: digiverse_staging_api
    restart: unless-stopped
    env_file:
      - ./backend/.env.staging
    volumes:
      - staging_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    container_name: digiverse_staging_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.staging
    command: ["python", "-m", "app.worker", "--poll-interval", "30", "--batch-size", "50"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: "DIGI-VERSE (Staging)"
    container_name: digiverse_staging_web
    restart: unless-stopped
    ports:
      - "${STAGING_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  staging_pg_data:
  staging_s3_data:
  staging_uploads:

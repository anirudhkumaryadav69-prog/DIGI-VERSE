# Render Blueprint for DIGI-VERSE Production Backend + Managed PostgreSQL 17
# All secret values, hostnames, and third-party keys use `sync: false` and must be entered
# directly in the Render Dashboard. No fake credentials or placeholder URLs are committed here.

databases:
  - name: digiverse-prod-db
    databaseName: digiverse_prod
    user: digiverse_prod_app
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - type: web
    name: digiverse-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: digiverse-prod-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: COOKIE_SECURE
        value: "True"
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: RATE_LIMIT_USE_DB
        value: "True"
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_JWT_SECRET_KEY
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Core capability toggles: keep disabled until respective live services/buckets are provisioned
      - key: PAYMENTS_ENABLED
        value: "False"
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: ASSET_STORAGE_BACKEND
        value: disabled
      - key: IMAGE_STORAGE_BACKEND
        value: disabled
      - key: EMAIL_ENABLED
        value: "False"
      - key: OTP_DELIVERY_PROVIDER
        value: disabled
      - key: ENABLE_DEV_OTP
        value: "False"
      - key: WHATSAPP_OTP_ENABLED
        value: "False"
      # Live Razorpay (required only after enabling PAYMENTS_ENABLED=True & PAYMENT_PROVIDER=razorpay)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Cloudflare R2 / S3 storage (separate buckets AND separate bucket-restricted API tokens)
      - key: ASSET_STORAGE_BUCKET
        sync: false
      - key: ASSET_STORAGE_REGION
        value: auto
      - key: ASSET_STORAGE_ENDPOINT_URL
        sync: false
      - key: ASSET_STORAGE_ACCESS_KEY
        sync: false
      - key: ASSET_STORAGE_SECRET_KEY
        sync: false
      - key: IMAGE_STORAGE_BUCKET
        sync: false
      - key: IMAGE_STORAGE_REGION
        value: auto
      - key: IMAGE_STORAGE_ENDPOINT_URL
        sync: false
      - key: IMAGE_STORAGE_ACCESS_KEY
        sync: false
      - key: IMAGE_STORAGE_SECRET_KEY
        sync: false
      - key: IMAGE_STORAGE_PREFIX
        value: public-images
      # Resend email (required only when EMAIL_ENABLED=True)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Meta WhatsApp Cloud API (required only when OTP_DELIVERY_PROVIDER=whatsapp & WHATSAPP_OTP_ENABLED=True)
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v20.0
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false

